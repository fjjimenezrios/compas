[project]
name = "flamenco-study"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beat-this>=1.1",
    "demucs>=4.0.1",
    "librosa>=0.11",
    "numpy",
    "soundfile",
    "starlette>=0.40",
    "torch>=2.4",
    "uvicorn>=0.30",
]

[project.scripts]
flamenco-study = "flamenco_study.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
